function shell(x){root.innerHTML=x;window.scrollTo({top:0,behavior:"instant"})}
function home(){mode="home";let seen=Object.keys(state.seen).length,m=Object.keys(state.mistakes).length,results=state.attempts;let best=results.length?Math.max(...results.map(x=>x.pct))+"%":"—";
shell('<section class="panel"><h2>Válassz gyakorlási módot!</h2><p class="muted">Minden kérdés önállóan is gyakorolható. A próbavizsga 12 véletlen kérdésből áll, és azonnal kiértékelhető.</p><div class="stats"><div class="stat"><b>'+seen+'/107</b>Átnézett kérdés</div><div class="stat"><b>'+m+'</b>Hibásnak jelölt</div><div class="stat"><b>'+best+'</b>Legjobb próbavizsga</div></div><div class="progress"><div style="width:'+(seen/107*100)+'%"></div></div></section>'+
'<section class="menu"><button class="tile" onclick="setup(\'cards\')"><strong>📚 Tanulókártyák</strong>Gyakorlás, válasz felfedése, önértékelés.</button><button class="tile" onclick="setup(\'test\')"><strong>📝 Próbavizsga</strong>12 véletlen kérdés, válaszok megadása és pontszám.</button><button class="tile" onclick="mistakeMode()"><strong>🔁 Hibák gyakorlása</strong>Csak a korábban elhibázott kérdések.</button><button class="tile" onclick="library()"><strong>📖 Teljes kérdésbank</strong>Mind a 107 kérdés és megoldás témakörök szerint.</button></section>'+
'<section class="panel"><h2>Témakörök</h2><div class="menu">'+TOPICS.map((t,i)=>'<button class="tile" onclick="startTopic('+i+')"><strong>'+esc(t)+'</strong>'+DB.filter(x=>x.topic===t).length+' kérdés</button>').join("")+'</div></section>'+
'<div class="row"><button class="danger" onclick="clearData()">Eredmények törlése</button><span class="muted small">Ez csak a saját készüléken tárolt előzményt törli.</span></div>')}
function setup(which){mode=which;shell('<section class="panel"><button class="ghost" onclick="home()">← Főmenü</button><h2>'+(which==="test"?"Próbavizsga":"Tanulókártyák")+'</h2><label for="topic">Témakör</label><select id="topic"><option value="all">Összes témakör</option>'+TOPICS.map((t,i)=>'<option value="'+i+'">'+esc(t)+'</option>').join("")+'</select>'+(which==="test"?'<p>12 kérdés, kérdésenként egy helyes válasz. A választható lehetőségek a kérdésbankból származnak. A vizsga gyakorló jellegű.</p>':'<label for="count">Kérdések száma</label><select id="count"><option value="12">12</option><option value="25">25</option><option value="107">Mind</option></select>')+'<p><button class="primary" onclick="launch()">Indítás</button></p></section>')}
function startTopic(i){run={kind:"cards",items:shuffle(DB.filter(x=>x.topic===TOPICS[i])),i:0,correct:0,wrong:0,review:false};render()}
function launch(){let cat=document.getElementById("topic").value;let pool=cat==="all"?DB:DB.filter(x=>x.topic===TOPICS[+cat]);let n=mode==="test"?Math.min(12,pool.length):Math.min(+document.getElementById("count").value,pool.length);run={kind:mode,items:shuffle(pool).slice(0,n),i:0,correct:0,wrong:0,review:false,responses:[]};render()}
function mistakeMode(){let pool=DB.filter(x=>state.mistakes[x.id]);if(!pool.length){shell('<section class="panel"><h2>Még nincs hibásnak jelölt kérdés.</h2><button class="primary" onclick="home()">Főmenü</button></section>');return}run={kind:"cards",items:shuffle(pool),i:0,correct:0,wrong:0,review:false};render()}
function distractors(q){let same=DB.filter(x=>x.id!==q.id&&x.topic===q.topic&&x.a.toLowerCase()!==q.a.toLowerCase());let more=DB.filter(x=>x.id!==q.id&&x.a.toLowerCase()!==q.a.toLowerCase());let pool=shuffle(same).concat(shuffle(more));let opts=[q.a];for(let x of pool){if(!opts.some(y=>norm(y)===norm(x.a)))opts.push(x.a);if(opts.length===4)break}return shuffle(opts)}
function norm(v){return String(v).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]/g,"")}
function render(){if(!run)return home();if(run.i>=run.items.length)return finish();let q=run.items[run.i],pct=Math.round(100*run.i/run.items.length);let top='<section class="panel"><div class="row"><button class="ghost" onclick="home()">← Főmenü</button><span class="pill">'+(run.kind==="test"?"Próbavizsga":"Gyakorlás")+'</span></div><p class="muted">'+esc(q.topic)+'</p><div class="progress"><div style="width:'+pct+'%"></div></div><p>'+ (run.i+1)+' / '+run.items.length+'</p><div class="question">'+esc(q.q)+'</div>';
if(run.kind==="cards"){top+='<div id="reveal"><button class="primary" onclick="reveal()">Válasz megmutatása</button></div></section>'}
else{run.options=distractors(q);top+='<div class="choices">'+run.options.map((o,i)=>'<button class="choice" data-choice="'+i+'" onclick="choose('+i+')">'+esc(o)+'</button>').join("")+'</div><div id="feedback"></div><button class="primary" id="next" onclick="next()" disabled>Következő →</button></section>'}shell(top)}
function reveal(){let q=run.items[run.i];state.seen[q.id]=true;save();document.getElementById("reveal").innerHTML='<div class="answer">'+esc(q.a)+'</div><p>El tudtad mondani helyesen?</p><button class="primary" onclick="rate(true)">Igen, tudtam</button><button class="danger" onclick="rate(false)">Még gyakorolnom kell</button>'}
function rate(ok){let q=run.items[run.i];if(ok){run.correct++;delete state.mistakes[q.id]}else{run.wrong++;state.mistakes[q.id]=true}save();run.i++;render()}
function choose(idx){if(run.review)return;run.review=true;let q=run.items[run.i];let picked=run.options[idx],ok=picked===q.a;state.seen[q.id]=true;if(ok){run.correct++;delete state.mistakes[q.id]}else{run.wrong++;state.mistakes[q.id]=true}run.responses.push({q:q.q,answer:q.a,selected:picked,ok});save();document.querySelectorAll(".choice").forEach((b,i)=>{b.disabled=true;if(i===idx)b.classList.add("selected")});document.getElementById("feedback").innerHTML='<div class="answer '+(ok?"":"wrong")+'">'+(ok?"Helyes válasz!":"Nem jó. Helyes válasz: "+esc(q.a))+'</div>';document.getElementById("next").disabled=false}
function next(){run.i++;run.review=false;render()}
function finish(){let isTest=run.kind==="test",pct=Math.round(100*run.correct/run.items.length);if(isTest){state.attempts.unshift({at:new Date().toISOString(),pct,correct:run.correct,total:run.items.length});state.attempts=state.attempts.slice(0,30);save()}shell('<section class="panel"><h2>Gyakorlás vége!</h2><div class="stats"><div class="stat"><b>'+run.correct+'</b>Helyes</div><div class="stat"><b>'+run.wrong+'</b>Hibás</div><div class="stat"><b>'+pct+'%</b>Eredmény</div></div><p>'+(pct>=80?"Szép munka!":pct>=50?"Jó úton haladsz, gyakorold a hibás kérdéseket!":"Érdemes újra átnézni a válaszokat.")+'</p><button class="primary" onclick="home()">Főmenü</button><button class="ghost" onclick="mistakeMode()">Hibásak gyakorlása</button>'+(isTest?'<h3>Válaszok áttekintése</h3>'+run.responses.map(x=>'<div class="listQ"><strong>'+esc(x.q)+'</strong><p>'+(x.ok?"✓ Helyes":"✗ Saját válasz: "+esc(x.selected))+'</p><p>Megoldás: '+esc(x.answer)+'</p></div>').join(""):"")+'</section>')}
function library(){mode="library";shell('<section class="panel"><button class="ghost" onclick="home()">← Főmenü</button><h2>Teljes kérdésbank (107)</h2><label for="search">Keresés kérdésben vagy válaszban</label><input id="search" placeholder="Írj be egy kifejezést…" oninput="showLibrary()"><label for="libtopic">Témakör</label><select id="libtopic" onchange="showLibrary()"><option value="all">Összes</option>'+TOPICS.map((t,i)=>'<option value="'+i+'">'+esc(t)+'</option>').join("")+'</select><div id="lib"></div></section>');showLibrary()}
function showLibrary(){let word=norm(document.getElementById("search").value),topic=document.getElementById("libtopic").value;let results=DB.filter(q=>(topic==="all"||q.topic===TOPICS[+topic])&&norm(q.q+" "+q.a).includes(word));document.getElementById("lib").innerHTML='<p class="muted">'+results.length+' találat</p>'+results.map(q=>'<details class="listQ"><summary><strong>'+q.id+'. '+esc(q.q)+'</strong></summary><div class="answer">'+esc(q.a)+'</div><span class="small muted">'+esc(q.topic)+'</span></details>').join("")}
function clearData(){if(confirm("Biztosan törölni szeretnéd a gyakorlási előzményeket?")){localStorage.removeItem(KEY);state.seen={};state.mistakes={};state.attempts=[];home()}}
home();
</script></body></html>
